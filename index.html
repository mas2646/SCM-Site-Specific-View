<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site-Specific Analysis - Surco Canal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #121212; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        
        .sites-container { width: 100vw; height: 100vh; padding: 20px; display: flex; flex-direction: column; }
        
        .tabs { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
        .tab-btn { padding: 10px 20px; background: #333; border: none; color: white; cursor: pointer; border-radius: 5px; font-weight: bold; transition: 0.3s; font-size: 0.8rem; }
        .tab-btn.active { background: #007bff; }
        
        .site-display { display: none; flex-grow: 1; position: relative; }
        .site-display.active { display: block; }
        
        .small-map { width: 100%; height: 70vh; position: relative; border: 1px solid #444; background: #000; overflow: hidden; }
        .layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-size: contain; background-repeat: no-repeat; background-position: center; transition: opacity 0.3s; }
        
        .controls { padding: 20px; text-align: center; background: rgba(0,0,0,0.5); }
        input[type=range] { width: 80%; cursor: pointer; accent-color: #007bff; }
        .year-label { font-size: 1.2rem; margin-bottom: 10px; color: #007bff; font-weight: bold; }
        .trace-control { margin-top: 10px; font-size: 0.9rem; color: #aaa; }
    </style>
</head>
<body>

<div class="sites-container">
    <div class="tabs">
        <button class="tab-btn active" onclick="openSite('metropolitano', event)">INFRASTRUCTURE</button>
        <button class="tab-btn" onclick="openSite('curve', event)">PROTECTION</button>
        <button class="tab-btn" onclick="openSite('mouth', event)">POLLUTION</button>
    </div>

    <div id="metropolitano" class="site-display active">
        <div class="small-map">
            <div class="layer m-1944" style="background-image: url('metro-zoomin/1944Metro.jpg'); opacity: 1;"></div>
            <div class="layer m-1971" style="background-image: url('metro-zoomin/1971Metro.jpg'); opacity: 0;"></div>
            <div class="layer m-2001" style="background-image: url('metro-zoomin/2001Metro.jpg'); opacity: 0;"></div>
            <div class="layer m-2025" style="background-image: url('metro-zoomin/2025Metro.jpg'); opacity: 0;"></div>
            <div class="layer metro-trace" style="background-image: url('metro-zoomin/Metro_Trace.png'); opacity: 0; z-index: 10;"></div>
        </div>
        <div class="trace-control">
            <input type="checkbox" id="check-metro" onchange="toggleTrace('metro-trace', this.checked)"> Show 2025 Canal Trace
        </div>
    </div>

    <div id="curve" class="site-display">
        <div class="small-map">
            <div class="layer c-1944" style="background-image: url('curve-zoomin/1944Curve.jpg'); opacity: 1;"></div>
            <div class="layer c-1971" style="background-image: url('curve-zoomin/1971Curve.jpg'); opacity: 0;"></div>
            <div class="layer c-2001" style="background-image: url('curve-zoomin/2001Curve.jpg'); opacity: 0;"></div>
            <div class="layer c-2025" style="background-image: url('curve-zoomin/2025Curve.jpg'); opacity: 0;"></div>
            <div class="layer curve-trace" style="background-image: url('curve-zoomin/Curve_Trace.png'); opacity: 0; z-index: 10;"></div>
        </div>
        <div class="trace-control">
            <input type="checkbox" id="check-curve" onchange="toggleTrace('curve-trace', this.checked)"> Show 2025 Canal Trace
        </div>
    </div>

    <div id="mouth" class="site-display">
        <div class="small-map">
            <div class="layer mo-1944" style="background-image: url('mouth-zoomin/1944Mouth.jpg'); opacity: 1;"></div>
            <div class="layer mo-1971" style="background-image: url('mouth-zoomin/1971Mouth.jpg'); opacity: 0;"></div>
            <div class="layer mo-2001" style="background-image: url('mouth-zoomin/2001Mouth.jpg'); opacity: 0;"></div>
            <div class="layer mo-2025" style="background-image: url('mouth-zoomin/2025Mouth.jpg'); opacity: 0;"></div>
            <div class="layer mouth-trace" style="background-image: url('mouth-zoomin/Mouth_Trace.png'); opacity: 0; z-index: 10;"></div>
        </div>
        <div class="trace-control">
            <input type="checkbox" id="check-mouth" onchange="toggleTrace('mouth-trace', this.checked)"> Show 2025 Canal Trace
        </div>
    </div>

    <div class="controls">
        <div id="site-label" class="year-label">Year: 1944</div>
        <input type="range" id="global-slider" min="0" max="3" value="0" oninput="updateYear(this.value)">
    </div>
</div>

<script>
    const years = ["1944", "1971", "2001", "2025"];

    function openSite(siteId, event) {
        document.querySelectorAll('.site-display').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(siteId).classList.add('active');
        event.currentTarget.classList.add('active');
    }

    function updateYear(val) {
        const year = years[val];
        document.getElementById('site-label').innerText = "Year: " + year;
        
        // Update all layers in all sites
        updateLayers('.m-', val);
        updateLayers('.c-', val);
        updateLayers('.mo-', val);
    }

    function updateLayers(prefix, index) {
        for(let i=0; i<4; i++) {
            const layers = document.querySelectorAll(prefix + years[i]);
            layers.forEach(l => l.style.opacity = (i == index) ? 1 : 0);
        }
    }

    function toggleTrace(className, show) {
        document.querySelectorAll('.' + className).forEach(el => el.style.opacity = show ? 1 : 0);
    }
</script>

</body>
</html>
